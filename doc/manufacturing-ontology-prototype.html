<script>
const objects={
 customer:{name:'华辰汽车',kind:'客户',id:'CUS-001',source:'ERP',description:'订单的需求方。通过订单，可以了解客户需求由哪些工单、设备和物料支撑。',fields:[['客户编码','CUS-001'],['关联订单','SO-20261008'],['负责团队','汽车事业部'],['数据来源','ERP / 客户主数据']],x:14,y:28},
 order:{name:'精密轴承采购订单',kind:'销售订单',id:'SO-20261008',source:'ERP',description:'客户希望在 10 月 12 日前收到 1,200 件精密轴承。ERP 记录承诺，MES 记录生产，IoT 记录设备状态。',fields:[['订单数量','1,200 件'],['已完工数量','720 件 / 60%'],['承诺交期','2026-10-12 18:00'],['关联工单','MO-1024'],['业务负责人','销售 · 王敏']],x:42,y:28},

const variants=['A','B','C'],names={A:'关系地图 · 探索业务',B:'业务旅程 · 讲解流程',C:'问题驱动 · 查找证据'};let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';let page='overview',selected='order',layer='business',question='delay',answered=false;let lastFocus;
const app=document.getElementById('app');const sourceTag=s=>'<span class="pill '+(s.includes('IoT')?'green':'')+'">'+s+'</span>';

function stats(){return '<div class="stats">'+[['业务对象','6','客户、订单、工单、物料、设备、采集点'],['业务关系','5','串起一条订单履约链'],['来源系统','3','ERP · MES · IoT'],['待关注异常','1','主轴超温 · 交期影响待确认']].map(x=>'<div class="stat"><span class="small">'+x[0]+'</span><strong>'+x[1]+'</strong><span class="small">'+x[2]+'</span></div>').join('')+'</div>'}

function detail(){let o=objects[selected];return '<aside class="card detail">'+sourceTag(o.source)+'<h2>'+o.name+'</h2><p>'+o.description+'</p><div class="fields">'+o.fields.map(f=>'<div class="field"><span>'+f[0]+'</span><b>'+f[1]+'</b></div>').join('')+'</div><div class="note '+(['order','work','device','sensor'].includes(selected)?'warn':'')+'">'+(['order','work','device','sensor'].includes(selected)?'关联提醒：设备超温可能影响订单履约，具体延误需结合排产核实。':'对象身份：通过业务编码连接跨系统记录。')+'</div><button class="primary" data-page="trace">查看异常影响链 →</button><button data-page="mapping">查看系统字段映射</button></aside>'}
function footerCards(){return '<div class="bottomgrid"><div class="card"><div class="cardhead row between"><h2>先理解业务，再理解系统</h2><span class="small">建议探索路径</span></div>'+[['01','订单是谁的？','选择客户与订单，理解需求和交期。','order'],['02','由谁完成？','打开工单，找到生产设备和物料。','work'],['03','为什么有风险？','从设备告警向上追溯受影响订单。','device']].map(x=>'<div class="listitem"><span class="pill">'+x[0]+'</span><div style="flex:1"><b>'+x[1]+'</b><div class="small">'+x[2]+'</div></div><button data-object="'+x[3]+'">查看</button></div>').join('')+'</div><div class="card"><div class="cardhead"><h2>每条信息都有出处</h2></div>'+[['ERP','客户、销售订单、物料主数据'],['MES','工单、报工、设备分配、领料'],['IoT','主轴温度、采集时间、告警事件']].map(x=>'<div class="listitem"><span class="dot"></span><div><b>'+x[0]+'</b><div class="small">'+x[1]+'</div></div>').join('')+'<div class="legend">来源说明为原型示例，尚未接入系统。</div></div></div>'}
function overviewA(){return heading('让每个系统，讲同一种业务语言','从一张订单出发，看懂客户、生产与设备之间的关系。','<button data-page="trace">探索一个异常案例 ↗</button>')+stats()+'<div class="workspace"><div><div class="card"><div class="cardhead row between"><h2>订单履约 · 业务关系地图</h2><div class="tabs"><button data-layer="business" class="'+(layer==='business'?'active':'')+'">业务视角</button><button data-layer="system" class="'+(layer==='system'?'active':'')+'">来源系统</button></div></div>'+graph()+'<div class="legend">点击节点查看详情 &nbsp; · &nbsp; 实线：业务关系 &nbsp; · &nbsp; 橙色虚线：异常相关关系</div></div><div class="banner"><div><b>设备温度升高，会影响哪张订单？</b><p>沿着「采集点 → 设备 → 工单 → 订单」查看证据。</p></div><button data-page="trace">追溯影响 →</button></div></div>'+detail()+'</div>'+footerCards()}
function overviewB(){return heading('一张订单，如何走过你的工厂','面向客户讲解：从销售承诺到现场执行，再到交付。')+'<div class="hero"><div><span class="pill">场景导览 / SO-20261008</span><h1 style="margin-top:14px">1,200 件轴承的履约旅程</h1><p>华辰汽车 · 交期 10 月 12 日 · 负责人 王敏</p></div><div><strong>720 <span style="font-size:16px;color:#9daec6">/ 1,200</span></strong><p>已完工 60% · 余量 480 件</p></div></div><div class="flow">'+[['01','接收客户需求','ERP 保存客户、销售订单及交期。','order','查看订单'],['02','安排生产任务','MES 将订单关联到精加工工单。','work','查看工单'],['03','执行与监测','CNC-07 生产，IoT 监测主轴温度。','device','查看设备'],['04','确认履约风险','当前设备暂停，交期影响待排产核实。','sensor','查看采集点']].map(x=>'<div class="card step"><div class="row between"><span class="num">'+x[0]+'</span>'+sourceTag(objects[x[3]].source)+'</div><h2>'+x[1]+'</h2><p>'+x[2]+'</p><button data-object="'+x[3]+'">'+x[4]+' →</button></div>').join('')+'</div><div class="workspace"><div class="card"><div class="cardhead"><h2>系统之间如何配合</h2></div><div class="timeline"><div class="event"><b>订单号关联生产工单</b><p>ERP 的销售订单号 → MES 的来源订单号；一张订单可拆分多张工单。</p></div><div class="event"><b>设备编码关联运行数据</b><p>MES 的设备编码 → IoT 的设备标识；需要维护统一编码映射。</p></div><div class="event"><b>用关系解释影响，用证据确认结论</b><p>告警关联工单和订单，但延误时间仍需要排产信息才能判断。</p></div></div><div class="legend"><button data-page="trace">继续：追溯本次异常 →</button></div></div>'+detail()+'</div>'}
function overviewC(){return heading('用一个问题，理解整个业务链','面向业务人员的问答入口；下方展示预设问答及来源证据。')+'<div class="question"><div class="tagline" style="text-align:center">ASK YOUR FACTORY</div><h1>今天，你想了解什么？</h1><p>从业务问题出发，把分散在系统里的信息连接起来。</p><div class="card askbox"><select id="question" aria-label="选择演示问题"><option value="delay" '+(question==='delay'?'selected':'')+'>这张订单为什么有交付风险？</option><option value="systems" '+(question==='systems'?'selected':'')+'>ERP、MES、IoT 分别负责什么？</option><option value="material" '+(question==='material'?'selected':'')+'>这张订单用了哪批物料？</option></select><button class="primary" id="ask">查看示例回答 →</button></div><div class="card answer"><div class="row between"><b>业务解读</b><span class="pill">预设演示 · 非实时 AI</span></div>'+answer()+'</div></div>'}
function answer(){if(!answered)return '<p class="muted">选择一个问题，查看带来源说明的示例回答。</p><div class="note">回答将区分记录事实、关联推断和待确认信息，让客户知道结论从哪里来。</div>';if(question==='systems')return '<p><b>ERP 管需求与承诺，MES 管现场执行，IoT 管设备采集。</b></p><p>在本案例里，ERP 保存订单 SO-20261008；MES 的 MO-1024 承接生产；IoT 提供 CNC-07 的主轴温度。这三类记录由订单号、设备编码连接。</p><button data-page="mapping">查看字段映射与负责系统 →</button>';if(question==='material')return '<p>本订单关联工单 MO-1024，工单领用的是 <b>GCr15 轴承钢 / LOT-0928</b>，演示领用量为 1,260 kg。</p><div class="note">依据：ERP 物料批次记录 + MES 工单领料记录。此处演示一张工单对应一批物料。</div><button data-object="material">查看物料对象 →</button>';return '<p>订单 <b>SO-20261008</b> 有潜在交期风险：关联的 MO-1024 工单暂停，执行设备 CNC-07 出现主轴超温告警。</p><div class="chain"><button data-object="sensor">86.4 ℃ · IoT</button> → <button data-object="device">CNC-07</button> → <button data-object="work">MO-1024</button> → <button data-object="order">销售订单</button></div><div class="note warn">这是关联推断。尚未确认超温是停机原因，也不能据此确定订单将延期。</div><button class="primary" data-page="trace">展开证据与处理建议 →</button>'}
function mapping(){return heading('业务概念，如何落到真实系统','同一个业务对象可能来自多个系统；明确字段来源、关联规则和负责人。')+'<div class="section card tablewrap"><table><thead><tr><th>统一业务对象</th><th>业务属性</th><th>来源系统 / 字段示例</th><th>关联规则</th><th>确认状态</th></tr></thead><tbody>'+[['客户','客户编码','ERP / Customer.Code','Customer.Code = Order.CustomerCode','已确认'],['销售订单','订单号 / 承诺交期','ERP / SalesOrder.No, DueDate','Order.No = WorkOrder.SourceOrderNo','已确认'],['生产工单','工单号 / 完工数量','MES / WorkOrder.No, CompletedQty','WorkOrder.DeviceCode = Equipment.Code','已确认'],['设备','设备编码 / 运行状态','MES / Equipment.Code','Equipment.Code ↔ IoT.AssetId','待设备主管确认'],['采集点','主轴温度 / 采集时间','IoT / spindle.temp, timestamp','AssetId + 点位编码','已确认'],['物料批次','物料编码 / 批次号','ERP + MES / MaterialCode, LotNo','WorkOrder.No = MaterialIssue.WorkOrderNo','已确认']].map(x=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td><td><span class="pill '+(x[4]==='已确认'?'green':'orange')+'">'+x[4]+' · 示例</span></td></tr>').join('')+'</tbody></table></div><div class="banner"><div><b>需要客户确认的关键关系</b><p>设备别名可能不同：MES 的 CNC-07 是否对应 IoT 的 asset_cnc_007？这是当前示例中的待确认映射。</p></div><button id="mappingReview">查看映射说明</button></div><div class="note">字段名与确认状态均为设计示例。实际接入时，需要核实主键、单位、时区、同步频率及业务归属。</div>'}
function trace(){return heading('一次设备告警，如何影响客户订单','沿业务关系追溯影响范围，并保留原始记录与待验证的判断。','<span class="pill orange">影响待确认</span>')+'<div class="banner"><div><b>潜在影响：1 张订单 · 1 张工单 · 480 件待生产</b><p>演示关联链：TEMP-07 → CNC-07 → MO-1024 → SO-20261008</p></div><button id="proposal" class="primary">预览处理建议</button></div><div class="workspace section"><div class="card"><div class="cardhead row between"><h2>证据时间线</h2><span class="small">2026-10-10 · 演示快照</span></div><div class="timeline"><div class="event"><span class="small">09:42:00 · IoT / ALARM-071</span><h3>主轴温度达到 86.4 ℃</h3><p>超过示例阈值 80 ℃，温度采集点归属于 CNC-07。</p><span class="pill green">记录事实</span></div><div class="event"><span class="small">09:43:10 · MES / EVENT-204</span><h3>工单 MO-1024 状态为暂停待检</h3><p>设备为 CNC-07，已完工 720 件，剩余 480 件。</p><span class="pill green">记录事实</span></div><div class="event"><span class="small">09:44:00 · 业务关系推断</span><h3>订单 SO-20261008 可能受到影响</h3><p>通过工单来源订单号关联 ERP 订单，承诺交期为 10 月 12 日 18:00。</p><span class="pill orange">关联推断 · 不是延期结论</span></div><div class="event"><span class="small">下一步 · 生产与设备负责人</span><h3>核实停机原因、维修时间与替代产能</h3><p>补充排产数据后，才能判断具体交付影响。</p><span class="pill">待人工确认</span></div></div></div><aside class="card detail"><span class="pill orange">业务影响</span><h2>把告警翻译成业务语言</h2><p>客户关注的是“能否按时交货”，现场关注的是“设备发生了什么”。这条关系链把两种语言连接起来。</p><div class="fields"><div class="field"><span>关联客户</span><b>华辰汽车</b></div><div class="field"><span>关联订单</span><b>SO-20261008</b></div><div class="field"><span>剩余产量</span><b>480 件</b></div><div class="field"><span>预计延期</span><b>信息不足</b></div></div><div class="note warn">设备映射尚待确认，正式分析前应先核实 CNC-07 与 IoT 设备标识的对应关系。</div><button data-page="mapping">核查关联依据</button></aside></div>'}
function objectPage(){return heading('业务对象目录','每一个对象，都有业务定义、来源系统和可追溯的关联。','<input class="filter" id="filter" placeholder="搜索名称、类型或编码" aria-label="搜索业务对象">')+'<div class="section card tablewrap"><table><thead><tr><th>对象名称</th><th>类型</th><th>业务编码</th><th>来源</th><th></th></tr></thead><tbody id="objectRows">'+Object.entries(objects).map(([k,o])=>'<tr data-search="'+(o.name+o.kind+o.id).toLowerCase()+'"><td><b>'+o.name+'</b></td><td>'+o.kind+'</td><td>'+o.id+'</td><td>'+sourceTag(o.source)+'</td><td><button data-object="'+k+'">探索对象 →</button></td></tr>').join('')+'</tbody></table><p id="empty" class="hidden" style="padding:24px">没有匹配对象，请尝试“订单”或“CNC”。</p></div>'}
function render(){document.getElementById('variantLabel').textContent=variant+' / '+names[variant];document.getElementById('crumb').textContent={overview:'业务全景',objects:'业务对象',mapping:'系统映射',trace:'异常追溯'}[page];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));app.innerHTML=page==='mapping'?mapping():page==='trace'?trace():page==='objects'?objectPage():variant==='B'?overviewB():variant==='C'?overviewC():overviewA();const state=document.createElement('div');state.className='state';state.textContent='原型状态：方案 '+variant+' · '+document.getElementById('crumb').textContent+' · 当前对象 '+objects[selected].id+' · 演示数据 · 更改仅在本次页面内生效';app.append(state)}
function changeVariant(delta){variant=variants[(variants.indexOf(variant)+delta+3)%3];page='overview';const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
function closeModal(){document.getElementById('modal').classList.add('hidden');lastFocus?.focus()}
function showModal(mappingOnly=false){lastFocus=document.activeElement;let m=document.getElementById('modal');m.innerHTML='<div class="modal"><div class="row between"><h2 id="modalTitle">'+(mappingOnly?'设备身份映射 · 示例':'处理建议预览 · 演示')+'</h2><button id="close" aria-label="关闭">✕</button></div>'+(mappingOnly?'<p>业务设备 CNC-07 在两个系统中使用不同的标识，需要由设备负责人核实对应关系。</p><div class="proposal">MES：Equipment.Code = CNC-07<br>IoT：AssetId = asset_cnc_007<br>统一对象：设备 / CNC-07</div><p>核对设备铭牌、所属产线及网关点位配置后，才能确认映射。当前原型保留“待确认”状态。</p>':'<p>基于演示告警生成的预设处理方案，供生产与设备负责人讨论。</p><div class="proposal"><b>建议设备负责人检查主轴温度</b><br>① 核实设备身份映射及传感器读数<br>② 检查设备，确认暂停原因与恢复时间<br>③ 由计划员评估替代设备产能和交期</div><p>关联对象：CNC-07 / MO-1024 / SO-20261008<br>建议执行系统：MES 维修模块<br>实际执行前：需要相应系统权限与业务确认。</p>')+'<button id="done" class="primary full">知道了 · 返回原型</button><div class="small" style="margin-top:12px">本原型仅预览，不创建维修单或修改外部系统。</div></div>';m.classList.remove('hidden');m.querySelector('#close').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}else if(b.dataset.object){selected=b.dataset.object;page='overview';if(variant==='C')variant='A';const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}else if(b.dataset.layer){layer=b.dataset.layer;render()}else if(b.id==='next')changeVariant(1);else if(b.id==='prev')changeVariant(-1);else if(b.id==='ask'){question=document.getElementById('question').value;answered=true;render()}else if(b.id==='proposal')showModal();else if(b.id==='mappingReview')showModal(true);else if(['close','done'].includes(b.id))closeModal()});
document.addEventListener('input',e=>{if(e.target.id!=='filter')return;let count=0;document.querySelectorAll('[data-search]').forEach(r=>{let found=r.dataset.search.includes(e.target.value.toLowerCase());r.classList.toggle('hidden',!found);if(found)count++});document.getElementById('empty').classList.toggle('hidden',count>0)});
document.addEventListener('keydown',e=>{let m=document.getElementById('modal');if(!m.classList.contains('hidden')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const bs=[...m.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus()}}return}if(e.target.closest('input,select,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();changeVariant(e.key==='ArrowLeft'?-1:1)}});render();
</script></body></html>
