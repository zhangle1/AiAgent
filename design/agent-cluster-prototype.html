om:9px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}.artifact-list{padding:0 0 0 16px;margin:7px 0;font-size:12px;overflow-wrap:anywhere}.artifact-list li{margin:3px 0}.diff{font-size:10px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;border-radius:6px;padding:7px 8px}.diff span{display:block}.del{color:var(--red);background:var(--red-bg)}.add{color:var(--green);background:var(--green-bg)}

<body>
<header class="top spread">
  <div class="row"><span class="logo" aria-hidden="true">✣</span><strong class="brand">AiAgent</strong><span class="crumb">订单平台</span></div>
  <div class="actions"><span class="demo-label">交互原型</span><button class="button quiet" id="show-tasks">全部任务</button><button class="button" id="new-task">＋ 新建任务</button></div>
</header>
<main>
  <header class="heading spread"><div><div id="task-id" class="task-code"></div><div class="task-title row"><h1 id="task-title"></h1><span id="task-status"></span></div><p class="wrap" id="task-goal"></p></div><div class="actions"><button class="button" id="stop-task">停止任务</button></div></header>
  <div class="toolbar spread">
    <nav class="mode" aria-label="工作台视图"><button id="mode-canvas" data-mode="canvas" aria-pressed="true">运行画布</button><button id="mode-chat" data-mode="chat" aria-pressed="false">任务对话</button></nav>
    <div class="task-meta row"><b id="repo" class="wrap"></b><code id="base" class="wrap"></code><span class="sep">·</span><span id="progress"></span></div>
  </div>
  <section id="canvas-view" class="workspace" aria-label="运行画布">
    <div class="stage">
      <div class="stage-head spread"><h2>运行拓扑</h2><div class="row"><span class="small hint">拖动节点或空白处 · 滚轮缩放</span><select id="canvas-select" class="canvas-select" aria-label="选择节点"></select></div></div>
      <div id="canvas-area" class="canvas" aria-label="任务执行图">
        <canvas id="edge-layer" class="edges" aria-hidden="true"></canvas>
        <div id="world" class="world"><div class="env-group"><div class="group-label spread"><span>执行环境 · dev-worker-01</span><span>独立 Git 副本</span></div></div><div id="nodes"></div></div>
        <div class="viewport-controls" data-no-drag><button id="zoom-out" title="缩小" aria-label="缩小">−</button><span class="zoom-label" id="zoom-label"></span><button id="zoom-in" title="放大" aria-label="放大">+</button><button id="fit" title="适应画布">适应</button></div>
        <canvas class="minimap" id="minimap" data-no-drag aria-label="画布缩略图"></canvas>
      </div>
      <div id="canvas-dock" class="composer-slot"></div>
    </div>
    <aside class="inspector" aria-labelledby="inspector-heading">
      <div class="inspector-top spread"><h2 id="inspector-heading">节点详情</h2><button class="button quiet" id="open-chat">打开对话 ↗</button></div>
      <div id="inspector-title" class="inspector-title row"></div>
      <div class="inspect-tabs" aria-label="节点详情分类"><button data-inspect="activity" aria-pressed="true">活动</button><button data-inspect="info" aria-pressed="false">信息</button><button data-inspect="artifact" aria-pressed="false">交付证据</button></div>
      <div id="inspect-body" class="inspect-body"></div>
      <div id="inspect-foot" class="inspect-foot" hidden></div>
    </aside>
  </section>
  <section id="chat-view" class="chat-view" aria-label="任务对话" hidden>
    <div id="chat-feed" class="chat-feed" tabindex="0" aria-label="任务消息"><div id="chat-flow" class="chat-flow"></div></div>
    <div id="chat-dock" class="chat-dock"></div>
  </section>
  <div id="composer-box">
    <form class="composer" id="composer">
      <label for="prompt" class="recipient" id="composer-label"></label>
      <textarea id="prompt" rows="1" maxlength="600" placeholder="保留原有排序，并加一条回归用例。"></textarea>
      <div class="spread"><span id="delivery-hint" class="composer-hint"></span><div class="actions"><button class="button" type="submit" value="queue">排到下一轮</button><button class="button primary" id="steer" type="submit" value="steer">追加到当前轮 ↑</button></div></div>
      <p id="feedback" class="feedback" aria-live="polite" hidden></p>
    </form>
    <div class="composer-closed spread" id="composer-closed" hidden><span id="closed-text"></span><button class="button" id="jump-active" hidden>跳到可介入节点</button></div>
  </div>
  <div class="demo-bar spread" aria-label="模拟运行控制">
    <div class="row"><span class="demo-title">模拟运行</span><span id="demo-hint"></span></div>
    <div class="actions"><label for="scenario">场景</label><select id="scenario"><option value="normal">正常交付</option><option value="failure">测试失败后修订</option><option value="stop">停止后恢复</option></select><button class="button" id="reset-demo">重置</button><button class="button primary" id="advance"></button></div>
  </div>
</main>
<dialog id="tasks-dialog" aria-labelledby="tasks-title"><div class="spread"><h2 id="tasks-title">代码任务</h2><button class="button quiet" data-close="tasks-dialog" aria-label="关闭">×</button></div><div class="task-list" id="task-list"></div></dialog>
<dialog id="create-dialog" aria-labelledby="create-title"><div class="spread"><h2 id="create-title">新建代码任务</h2><button class="button quiet" data-close="create-dialog" aria-label="关闭">×</button></div>
  <form id="create-form"><label>任务标题<input name="title" required maxlength="66" placeholder="修复订单状态筛选" autofocus></label><div class="fields"><label>仓库<input name="repo" required maxlength="60" value="orders-service"></label><label>基线分支<input name="branch" required maxlength="60" value="main"></label></div><label>验收条件<textarea name="goal" required maxlength="240" placeholder="描述想要的结果和应保留的行为。"></textarea></label><div class="actions"><button type="button" class="button" data-close="create-dialog">取消</button><button class="button primary" type="submit">启动任务</button></div></form>
</dialog>
<script>
const labels = {
  writing: ['正在实现', 'live'], checking: ['正在验证与审查', 'live'],
  needsFix: ['测试失败 · 待修订', 'bad'], review: ['等待人工审阅', 'warn'],
  approved: ['已批准 · 待推送', 'good'], delivered: ['已推送任务分支', 'good'],
  stopped: ['已停止', 'warn']
};
const scenarioHints = {
  normal: '先追加一条指令，再推进到验证与审查。',
  failure: '首轮验证会失败。进入修订后，比较两个候选版本。',
  stop: '使用「停止任务」，再观察队列和恢复状态。'
};
const example = {
  number: 24, title: '修复订单状态筛选', repo: 'orders-service', branch: 'main', base: '53d8a21',
  goal: '修复订单状态筛选遗漏，保留原有列表排序，并增加回归用例。', example: true
};
const exampleFiles = [
  { name: 'src/Orders/OrderQuery.cs', added: 8, removed: 2 },
  { name: 'tests/Orders/OrderQueryTests.cs', added: 19, removed: 0 }
];
const genericFiles = [
  { name: 'src/Feature.cs', added: 8, removed: 2 },
  { name: 'tests/FeatureTests.cs', added: 19, removed: 0 }
];

function newTask(spec, scenario = 'normal') {
  return { ...spec, scenario, phase: 'writing', previous: null, revision: 1, candidate: null,
    tests: 'pending', reviewResult: 'pending', queue: [], pending: null, sequence: 0,
    events: [
      { step: 'prepare', who: 'Git', tone: 'good', title: '工作区已就绪', body: `已从 ${spec.branch} @ ${spec.base} 创建独立任务副本。`, time: '10:21' },
      { step: 'write', who: 'CX', tone: 'live', title: 'Codex 开始实现', body: spec.example ? '正在检查订单状态过滤与排序逻辑。' : '正在分析任务目标和相关代码。', time: '10:22' },
      { step: 'write', who: 'CX', tone: 'live', title: '工作区已出现改动', body: spec.example ? '已更新 OrderQuery.cs 的筛选条件，并添加缺省状态回归用例。' : '已生成两处模拟变更，等待封存和验证。', time: '10:23' }
    ] };
}

// The simulated runtime advances only in response to actions. It has no DOM or network access.
function transition(task, action) {
  const updated = { ...task, events: [...task.events] };
  const record = (step, who, tone, title, body) => {
    const time = `10:${String(23 + Math.floor(updated.sequence / 3)).padStart(2, '0')}`;
    updated.sequence++;
    updated.events.push({ step, who, tone, title, body, time });
  };
  const takeQueued = (step, who) => {
    for (const message of updated.queue.filter(entry => entry.step === step)) {
      record(step, who, 'live', '已送达下一轮', message.body);
    }
    updated.queue = updated.queue.filter(entry => entry.step !== step);
  };

  switch (action.type) {
    case 'queue':
      if (!activeRecipient(task, action.step)) return task;
      updated.queue = [...task.queue, { step: action.step, body: action.body }];
      record(action.step, '林', 'live', '已排到下一轮', action.body);
      return updated;
    case 'steer':
      if (task.phase !== 'writing' || action.step !== 'write' || task.pending) return task;
      updated.pending = { id: action.id, body: action.body };
      record('write', '林', 'live', '正在投递到当前轮', action.body);
      return updated;
    case 'ack':
      if (task.pending?.id !== action.id) return task;
      updated.pending = null;
      record('write', 'CX', 'good', '已送达当前轮', 'Codex 已确认接收追加指令。');
      return updated;
    case 'stop':
      if (!['writing', 'checking'].includes(task.phase)) return task;
      updated.previous = task.phase;
      updated.phase = 'stopped';
      updated.pending = null;
      record('human', '林', 'warn', '任务已停止', task.pending ? '追加指令待确认。后续步骤与排队消息已挂起。' : '保留当前改动与排队消息，后续步骤已挂起。');
      return updated;
    case 'resume':
      if (task.phase !== 'stopped') return task;
      updated.phase = task.previous;
      updated.previous = null;
      record('human', '林', 'live', '任务已继续', '从已知工作区或候选提交继续执行。');
      return updated;
    case 'revise':
      if (!['review', 'needsFix'].includes(task.phase)) return task;
      updated.phase = 'writing';
      updated.revision++;
      updated.candidate = null;
      updated.tests = 'pending';
      updated.reviewResult = 'pending';
      record('write', task.phase === 'review' ? '林' : 'CX', 'live', `开始第 ${updated.revision} 次实现`, `参考候选 ${task.candidate} 的测试与审查记录。`);
      return updated;
    case 'approve':
      if (task.phase !== 'review') return task;
      updated.phase = 'approved';
      record('human', '林', 'good', '已批准此版本', `审批绑定候选提交 ${task.candidate} 和本次验证。`);
      return updated;
    case 'push':
      if (task.phase !== 'approved') return task;
      updated.phase = 'delivered';
      record('human', 'Git', 'good', '已推送独立分支', `模拟交付 agent/task-${task.number} @ ${task.candidate}。`);
      return updated;
    case 'advance':
      if (task.phase === 'writing' && !task.pending) {
        takeQueued('write', 'CX');
        updated.candidate = (0x8cd7000 + task.number * 19 + task.revision * 199).toString(16);
        updated.phase = 'checking';
        record('write', 'Git', 'good', '候选提交已封存', `已固定候选 ${updated.candidate}，等待同版本验证。`);
        record('test', 'CI', 'live', '测试开始', `从 ${updated.candidate} 创建验证副本。`);
        record('review', 'CC', 'live', 'Claude 开始独立审查', `读取 ${updated.candidate} 的差异，工作区为只读。`);
        return updated;
      }
      if (task.phase === 'checking') {
        takeQueued('review', 'CC');
        const fails = task.scenario === 'failure' && task.revision === 1;
        updated.tests = fails ? 'failed' : 'passed';
        updated.reviewResult = fails ? 'changes' : 'passed';
        updated.phase = fails ? 'needsFix' : 'review';
        record('test', 'CI', fails ? 'bad' : 'good', fails ? '回归测试失败' : '测试已通过', fails ? '18 项通过，1 项失败。缺省状态仍被过滤。' : '19 项通过，其中 1 项是本轮回归用例。');
        record('review', 'CC', fails ? 'bad' : 'good', fails ? '审查建议修订' : '独立审查通过', fails ? '保留缺省状态，并对原有排序增加断言。' : '改动范围符合目标，未发现阻塞交付的问题。');
        if (!fails) record('human', 'Git', 'good', '等待人工审阅', `测试、审查和 diff 都绑定到 ${task.candidate}。`);
        return updated;
      }
  }
  return task;
}

function activeRecipient(task, step) {
  return (task.phase === 'writing' && step === 'write') || (task.phase === 'checking' && step === 'review');

function statusOf(task, node) {
  if (node === 'server') return labels[task.phase];
  if (node === 'env') return ['工作区已就绪', 'good'];
  if (task.phase === 'stopped') {
    const state = statusOf({ ...task, phase:task.previous }, node);
    return state[1] === 'live' ? ['已停止', 'warn'] : state;
  }
  if (node === 'write') return task.phase === 'writing' ? [`执行中 · 第 ${task.revision} 次`, 'live'] : ['候选已封存', 'good'];
  if (node === 'test') {
    if (task.tests === 'failed') return ['1 项失败', 'bad'];
    if (task.tests === 'passed') return ['19 项通过', 'good'];
    if (task.phase === 'checking') return ['正在运行', 'live'];
  }
  if (node === 'review') {
    if (task.reviewResult === 'changes') return ['建议修订', 'warn'];
    if (task.reviewResult === 'passed') return ['审查通过', 'good'];
    if (task.phase === 'checking') return ['审查中', 'live'];
  }
  if (node === 'human' && ['review','approved','delivered'].includes(task.phase)) return labels[task.phase];
  return ['等待上游', ''];
}

function nextRecipient(task) {
  if (task.phase === 'writing') return 'write';
  if (task.phase === 'checking') return 'review';
  return null;
}

function activeNodeFor(task) {
  return nextRecipient(task) || (task.phase === 'needsFix' ? 'test' : task.phase === 'stopped' ? (task.previous === 'checking' ? 'review' : 'write') : 'human');
}

function nodeEvents(task) {
  if (selected === 'server') return task.events;
  if (selected === 'env') return task.events.filter(event => event.step === 'prepare');
  return task.events.filter(event => event.step === selected);
}

function surface(canvas) {
  const width = canvas.clientWidth || canvas.parentElement.clientWidth;
  const height = canvas.classList.contains('edges') ? canvas.parentElement.clientHeight : canvas.clientHeight;
  const pixelRatio = window.devicePixelRatio || 1;
  const pixelsWide = Math.round(width * pixelRatio);
  const pixelsHigh = Math.round(height * pixelRatio);
  if (canvas.width !== pixelsWide || canvas.height !== pixelsHigh) {
    canvas.width = pixelsWide;
    canvas.height = pixelsHigh;
  }
  const context = canvas.getContext('2d');
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  context.clearRect(0, 0, width, height);
  return {context, width, height};
}

function drawGraph() {
  if (mode !== 'canvas') return;
  const task = tasks.get(taskNumber);
  const {context:ctx} = surface($('edge-layer'));
  ctx.translate(camera.x, camera.y);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.lineWidth = 1.75;
  ctx.lineCap = 'round';
  for (const [source, target, label] of edges) {
    const start = positions.get(source);
    const end = positions.get(target);
    const x1 = start.x + nodeWidth;
    const x2 = end.x;
    const y1 = start.y + nodeHeight / 2;
    const y2 = end.y + nodeHeight / 2;
    const handle = Math.max(24, Math.abs(x2 - x1) * .56);
    let tone = statusOf(task, target)[1];
    if (target === 'human' && tone === '') tone = statusOf(task, source)[1] === 'bad' ? 'bad' : '';
    ctx.strokeStyle = colors[tone];
    ctx.fillStyle = colors[tone];
    ctx.setLineDash(tone === 'live' ? [6, 4] : []);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(x1 + handle, y1, x2 - handle, y2, x2 - 5, y2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x2 - 3, y2);
    ctx.lineTo(x2 - 10, y2 - 3.5);
    ctx.lineTo(x2 - 10, y2 + 3.5);
    ctx.fill();
    if (x2 - x1 > 40) {
      const x = (x1 + x2) / 2;
      const y = (y1 + y2) / 2;
      ctx.font = '11px "Microsoft YaHei UI", sans-serif';
      ctx.textAlign = 'center';
      const width = ctx.measureText(label).width + 10;
      ctx.fillStyle = '#f7faff';
      ctx.fillRect(x - width / 2, y - 10, width, 19);
      ctx.fillStyle = tone === 'live' ? '#184db6' : '#536c8e';
      ctx.fillText(label, x, y + 4);
    }
  }
  if (task.phase === 'needsFix') {
    const test = positions.get('test');
    const write = positions.get('write');
    const startX = test.x + nodeWidth / 2;
    const endX = write.x + nodeWidth / 2;
    ctx.strokeStyle = colors.bad;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(startX, test.y);
    ctx.bezierCurveTo(startX, 13, endX, 66, endX, write.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = colors.bad;
    ctx.font = '12px "Microsoft YaHei UI", sans-serif';
    ctx.fillText('返回实现 · 修订', (startX + endX) / 2, 73);
  }
  drawMinimap(task);
}

function drawMinimap(task) {
  const {context:ctx, width, height} = surface($('minimap'));
  ctx.fillStyle = '#f2f6fd';
  ctx.fillRect(width * .20, height * .09, width * .61, height * .87);
  for (const node of graph) {
    const position = positions.get(node.id);
    ctx.fillStyle = node.id === selected ? '#2560e8' : colors[statusOf(task, node.id)[1]];
    ctx.fillRect(position.x * width / 1120, position.y * height / 440, nodeWidth * width / 1120, nodeHeight * height / 440);
  }
  const canvas = $('canvas-area');
  ctx.strokeStyle = '#6e96d4';
  const visibleX = -camera.x / camera.zoom * width / 1120;
  const visibleY = -camera.y / camera.zoom * height / 440;
  ctx.strokeRect(visibleX, visibleY, canvas.clientWidth / camera.zoom * width / 1120, canvas.clientHeight / camera.zoom * height / 440);
}

function applyCamera() {
  const canvas = $('canvas-area');
  $('world').style.transform = `translate(${camera.x}px,${camera.y}px) scale(${camera.zoom})`;
  canvas.style.backgroundPosition = `${camera.x}px ${camera.y}px`;
  const grid = Math.max(12, 19 * camera.zoom);
  canvas.style.backgroundSize = `${grid}px ${grid}px`;
  $('zoom-label').textContent = `${Math.round(camera.zoom * 100)}%`;
  drawGraph();
}

function fitCanvas() {
  const canvas = $('canvas-area');
  if (!canvas.clientWidth) return;
  const locations = [...positions.values()];
  const left = Math.min(0, ...locations.map(point => point.x - 14));
  const top = Math.min(24, ...locations.map(point => point.y - 16));
  const right = Math.max(1120, ...locations.map(point => point.x + nodeWidth + 14));
  const bottom = Math.max(440, ...locations.map(point => point.y + nodeHeight + 16));
  const width = right - left;
  const height = bottom - top;
  camera.zoom = Math.min(1.19, (canvas.clientWidth - 23) / width, (canvas.clientHeight - 66) / height);
  camera.x = (canvas.clientWidth - width * camera.zoom) / 2 - left * camera.zoom;
  camera.y = (canvas.clientHeight - 47 - height * camera.zoom) / 2 - top * camera.zoom;
  camera.fitted = true;
  applyCamera();
}

function zoomAt(factor, x, y) {
  const zoom = Math.max(.25, Math.min(2.4, camera.zoom * factor));
  camera.x = x - (x - camera.x) * zoom / camera.zoom;
  camera.y = y - (y - camera.y) * zoom / camera.zoom;
  camera.zoom = zoom;
  camera.fitted = false;
  applyCamera();
}

  const header = `<div class="artifact-tabs" aria-label="证据类型">${buttons}</div><div class="version"><span>基线 <code>${html(task.base)}</code></span><span>候选 <code>${task.candidate ?? '等待封存'}</code></span></div>`;
  const files = task.example ? exampleFiles : genericFiles;

  if (artifact === 'tests') return `${header}${task.tests === 'pending' ? '<p class="empty">测试完成后会关联到候选提交。</p>' : `${badge(statusOf(task, 'test'))}<ul class="artifact-list"><li>dotnet test · 退出码 ${task.tests === 'passed' ? 0 : 1}</li><li>${task.tests === 'passed' ? '缺省状态与排序回归均通过。' : '缺省状态用例失败，等待修订。'}</li></ul>`}`;
  if (artifact === 'review') return `${header}${task.reviewResult === 'pending' ? '<p class="empty">独立 Agent 尚未提交审查意见。</p>' : `${badge(statusOf(task, 'review'))}<p class="empty">${task.reviewResult === 'passed' ? '只读审查已完成，变更范围符合目标。' : '建议补全缺省输入的处理，并核对排序回归。'}</p>`}`;
  const missingDefault = task.scenario === 'failure' && task.revision === 1;
  const diff = task.example ? [ '- .Where(o => o.Status == status)', `+ .Where(o => status == ${missingDefault ? '""' : 'null'} || o.Status == status)` ] : [ '- return PreviousResult(input);', '+ return UpdatedResult(input);' ];
  return `${header}<ul class="artifact-list">${files.map(file => `<li><code>${file.name}</code> <span class="add">+${file.added}</span></li>`).join('')}</ul><pre class="diff"><span class="del">${html(diff[0])}</span><span class="add">${html(diff[1])}</span></pre>`;
}

  $('base').textContent = `${task.branch} @ ${task.base}`;
  const stepIds = ['env','write','test','review','human'];
  const finished = stepIds.filter(id => statusOf(task,id)[1] === 'good').length;
  $('progress').textContent = `${finished} / 5 步完成`;
  $('stop-task').hidden = !['writing','checking','stopped'].includes(task.phase);
  $('stop-task').textContent = task.phase === 'stopped' ? '继续任务' : '停止任务';
  $('canvas-view').hidden = mode !== 'canvas';
  $('chat-view').hidden = mode !== 'chat';
  $('mode-canvas').setAttribute('aria-pressed', mode === 'canvas');
  $('mode-chat').setAttribute('aria-pressed', mode === 'chat');
  const dock = $(mode === 'canvas' ? 'canvas-dock' : 'chat-dock');
  if ($('composer-box').parentElement !== dock) dock.append($('composer-box'));
  renderComposer(task);
  if (mode === 'canvas') { renderNodes(task); renderInspector(task); applyCamera(); }
  else renderChat(task);
  $('demo-hint').textContent = scenarioHints[task.scenario];
  $('scenario').value = task.scenario;
  const next = { writing:'封存候选 →', checking:'收集验证结果 →', needsFix:'自动修订 →', stopped:'继续任务' }[task.phase];
  $('advance').textContent = next || '';
  $('advance').hidden = !next;
  $('advance').disabled = !!task.pending;
}

function chooseNode(id, focus = false) {
  if (selected !== id) $('feedback').hidden = true;
  selected = id;
  panel = id === 'human' && tasks.get(taskNumber).candidate ? 'artifact' : 'activity';
  render();
  if (focus) $('nodes').querySelector(`[data-node="${id}"]`)?.focus({preventScroll:true});
}

function setMode(next) {
  mode = next;
  render();
  if (mode === 'canvas' && camera.fitted) fitCanvas();
}

function dispatch(action, target = taskNumber) {
  const before = tasks.get(target);
  const after = transition(before, action);
  if (before === after) return;
  tasks.set(target, after);
  if (target === taskNumber && before.phase !== after.phase) {
    selected = activeNodeFor(after);
    artifact = after.phase === 'needsFix' ? 'tests' : 'diff';
    panel = after.candidate && ['needsFix','review','approved','delivered'].includes(after.phase) ? 'artifact' : 'activity';
    $('feedback').hidden = true;
  }
  render();
}

function openTask(number) {
  taskNumber = number;
  selected = activeNodeFor(tasks.get(number));
  panel = 'activity';
  artifact = 'diff';
  visibleDraft = null;
  $('feedback').hidden = true;
  setMode(mode);
}

document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  const {close, open, mode:next, node, inspect, artifact:tab, command} = button.dataset;
  if (close) $(close).close();
  if (open) { $('tasks-dialog').close(); openTask(Number(open)); }
  if (next) setMode(next);
  if (node && (!suppressNodeClick || event.detail === 0)) chooseNode(node, event.detail === 0);
  if (node) suppressNodeClick = false;
  if (inspect) { panel = inspect; renderInspector(tasks.get(taskNumber)); }
  if (tab) { artifact = tab; renderInspector(tasks.get(taskNumber)); }
  if (command) dispatch({type:command});
  if (button.id === 'chat-graph') {
    if (tasks.get(taskNumber).candidate) { panel = 'artifact'; artifact = 'diff'; }
    setMode('canvas');
  }
});
$('open-chat').addEventListener('click', () => setMode('chat'));
$('jump-active').addEventListener('click', () => chooseNode(nextRecipient(tasks.get(taskNumber))));
$('canvas-select').addEventListener('change', event => chooseNode(event.target.value));
$('new-task').addEventListener('click', () => $('create-dialog').showModal());
$('show-tasks').addEventListener('click', () => {
  $('task-list').innerHTML = [...tasks.values()].reverse().map(task => `<button data-open="${task.number}"><b>${html(task.title)}</b>${badge(labels[task.phase])}</button>`).join('');
  $('tasks-dialog').showModal();
});
$('create-form').addEventListener('submit', event => {
  event.preventDefault();
  const fields = Object.fromEntries([...new FormData(event.target)].map(([key, value]) => [key, value.trim()]));
  if (Object.values(fields).some(value => !value)) return;
  const number = Math.max(...tasks.keys()) + 1;
  tasks.set(number, newTask({...fields, number, base:'53d8a21', example:false}));
  $('create-dialog').close();
  event.target.reset();
  openTask(number);
});
$('prompt').addEventListener('input', event => drafts.set(visibleDraft, event.target.value));
$('composer').addEventListener('submit', event => {
  event.preventDefault();
  const task = tasks.get(taskNumber);
  const body = $('prompt').value.trim();
  const type = event.submitter?.value || 'queue';
  if (!body) { $('prompt').focus(); return; }
  if (!activeRecipient(task, selected) || (type === 'steer' && (selected !== 'write' || task.pending))) return;
  const target = taskNumber;
  const id = ++deliveryId;
  dispatch({type, step:selected, body, id});
  $('prompt').value = '';
  drafts.delete(visibleDraft);
  $('feedback').textContent = type === 'steer' ? '正在等待投递确认…' : '已保存，等待该 Agent 的下一轮。';
  $('feedback').hidden = false;
  if (type === 'steer') setTimeout(() => {
    if (tasks.get(target).pending?.id !== id) return;
    dispatch({type:'ack', id}, target);
    if (target === taskNumber && selected === 'write') {
      $('feedback').textContent = '已送达当前轮。';
      $('feedback').hidden = false;
    }
  }, 450);
});
$('stop-task').addEventListener('click', () => dispatch({type:tasks.get(taskNumber).phase === 'stopped' ? 'resume' : 'stop'}));
$('advance').addEventListener('click', () => {
  const phase = tasks.get(taskNumber).phase;
  dispatch({type:{needsFix:'revise', stopped:'resume'}[phase] || 'advance'});
});
function resetScenario(value) {
  const task = tasks.get(taskNumber);
  tasks.set(taskNumber, newTask(task, value ?? task.scenario));
  for (const node of graph) {
    positions.set(node.id, {x:node.x, y:node.y});
    drafts.delete(`${taskNumber}:${node.id}`);
  }
  suppressNodeClick = false;
  camera.fitted = true;
  openTask(taskNumber);
}
$('scenario').addEventListener('change', event => resetScenario(event.target.value));
$('reset-demo').addEventListener('click', () => resetScenario());

const viewport = $('canvas-area');
viewport.addEventListener('pointerdown', event => {
  if (event.button !== 0 || event.target.closest('[data-no-drag]')) return;
  suppressNodeClick = false;
  const button = event.target.closest('[data-node]');
  const node = button?.dataset.node;
  drag = {pointer:event.pointerId, node, button, x:event.clientX, y:event.clientY, origin:node ? {...positions.get(node)} : {x:camera.x,y:camera.y}, moved:false};
});
window.addEventListener('pointermove', event => {
  if (!drag || event.pointerId !== drag.pointer) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx,dy) < 4) return;
  if (!drag.moved) { drag.moved = true; viewport.setPointerCapture(event.pointerId); viewport.dataset.dragging = ''; }
  if (drag.node) {
    const next = {x:drag.origin.x + dx / camera.zoom, y:drag.origin.y + dy / camera.zoom};
    positions.set(drag.node, next);
    drag.button.style.left = `${next.x}px`;
    drag.button.style.top = `${next.y}px`;
  } else {
    camera.x = drag.origin.x + dx;
    camera.y = drag.origin.y + dy;
  }
  camera.fitted = false;
  applyCamera();
});
function endDrag(event) {
  if (!drag || event.pointerId !== drag.pointer) return;
  suppressNodeClick = drag.moved;
  drag = null;
  delete viewport.dataset.dragging;
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
viewport.addEventListener('wheel', event => {
  event.preventDefault();
  const area = viewport.getBoundingClientRect();
  zoomAt(Math.exp(-event.deltaY * .0015), event.clientX - area.left, event.clientY - area.top);
}, {passive:false});
$('zoom-in').addEventListener('click', () => zoomAt(1.22, viewport.clientWidth / 2, viewport.clientHeight / 2));
$('zoom-out').addEventListener('click', () => zoomAt(1 / 1.22, viewport.clientWidth / 2, viewport.clientHeight / 2));
$('fit').addEventListener('click', fitCanvas);
$('minimap').addEventListener('click', event => {
  const area = $('minimap').getBoundingClientRect();
  camera.x = viewport.clientWidth / 2 - (event.clientX - area.left) / area.width * 1120 * camera.zoom;
  camera.y = viewport.clientHeight / 2 - (event.clientY - area.top) / area.height * 440 * camera.zoom;
  camera.fitted = false;
  applyCamera();
});
new ResizeObserver(() => {
  if (mode !== 'canvas') return;
  if (camera.fitted) fitCanvas();
  else applyCamera();
}).observe(viewport);
render();
fitCanvas();
</script>
</body>
</html>
