d:#d2eee1;color:#096d53}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}.message{padding:18px;border-radius:10px;background:#f1f5f3;margin:15px 0}.message.agent{background:#eaf5f1;border-left:3px solid var(--teal)}.diff{background:#122e34;color:#d3f2df;font:12px/1.9 ui-monospace,monospace;padding:20px;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}.note{padding:12px 15px;border-radius:8px;background:#fff8e9;color:#946c27;font-size:12px}.version{border-left:2px solid #95cdb5;padding:0 0 24px 22px;margin-left:7px}.empty{padding:60px;text-align:center;color:var(--muted)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#143e36;color:white;padding:12px 24px;border-radius:10px;box-shadow:0 8px 30px #1234;display:none;z-index:5}a{color:var(--teal)}@media(max-width:1100px){.workspace{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;gap:12px}.sidebar nav{display:flex;overflow:auto}.sidebar button{white-space:nowrap}.sidebar footer,.sidebar .eyebrow{display:none}.top{padding:12px}.content{padding:18px}.hero{align-items:flex-start;flex-direction:column}h1{font-size:24px}.graph{padding:0}.cardbody{padding:15px}.tablewrap{overflow:auto}.strip{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:12px}.graph svg{min-height:230px}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><i>A</i>AiAgent<div class="eyebrow">Customer intelligence</div></div><nav aria-label="本体工作台"><button data-page="model">◈　业务本体</button><button data-page="sources">⇄　数据与映射</button><button data-page="chat">✧　聊天与 Agent</button><button data-page="review">☷　变更与发布</button><button data-page="versions">◷　版本记录</button></nav><footer>把客户认知变成共同语言<br>定义 · 连接 · 推理 · 演进<br><br>交互设计 v0.1 / 2026.11<br>全部为合成示例，刷新重置</footer></aside><main>
<header class="top"><div class="row"><span class="muted">客户本体 /</span><select id="scope" aria-label="客户与项目"><option value="delivery">华辰制造 · 交付预警</option><option value="erp">华辰制造 · ERP 升级</option><option value="retail">澄海商贸 · 客户经营</option></select></div><span class="badge amber">交互原型 · 未连接真实系统</span></header>
<div class="content"><div class="hero"><div><div class="eyebrow">Ontology workspace</div><h1 id="title"></h1><p class="muted" id="subtitle"></p></div><div class="row"><button id="export">↓ 导出模型 JSON</button><button class="primary" data-page="chat">＋ 用自然语言建模</button></div></div><div id="app"></div><div class="strip"><div><b>从资料到模型，从模型到可追溯的业务回答。</b><div class="muted">公司维护业务定义，项目固定引用版本；模型发布和业务系统写入各自审批。</div></div><a href="solution.md">阅读完整方案 ↗</a></div></div></main></div><div id="toast" role="status"></div>
<script>
'use strict';
const configs={delivery:{company:'华辰制造',project:'交付预警',baseline:12,names:['客户','销售订单','工单','产品','交付计划','供应商'],ids:['customer','sales_order','work_order','product','delivery_plan','supplier']},erp:{company:'华辰制造',project:'ERP 升级',baseline:11,names:['客户','销售订单','采购单','物料','仓库','供应商'],ids:['customer','sales_order','purchase_order','material','warehouse','supplier']},retail:{company:'澄海商贸',project:'客户经营',baseline:4,names:['会员','消费订单','门店','商品','优惠券','营销活动'],ids:['member','retail_order','store','goods','coupon','campaign']}};
const states={};let scope='delivery',page='model',selected=1,filter='',timer;const app=document.getElementById('app');
function state(){return states[scope]??=( {version:configs[scope].baseline,proposal:null,history:[],question:'给订单增加「承诺交期」，映射 ERP delivery_date，并补充已逾期判断规则。'} );}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',3200);}
function fields(i){const c=configs[scope];return i===1?[['订单号','order_no','string · 业务主键'],['客户编码','customer_id','string · 关联键'],['订单状态','status','enum · 待确认口径'],...(state().history.length?[['承诺交期','promised_date','date · 可空']]:[])]:[['唯一编码',c.ids[i]+'_id','string · 业务主键'],['名称','name','string'],['状态','status','enum']];}
function modelExport(){const c=configs[scope],s=state();return{schema_version:'aiagent-ontology-demo-1',demo:true,scope,company:c.company,project:c.project,version:s.version,objects:c.names.map((n,i)=>({id:c.ids[i],label:n,properties:fields(i).map(f=>({id:f[1],label:f[0],description:f[2]}))})),links:relations().map(([a,b,label])=>({from:c.ids[a],to:c.ids[b],label})),note:'合成演示；不是已连接业务系统的完整发布模型'};}
function relations(){return scope==='retail'?[[0,1,'下单 · 1:N'],[1,2,'发生于 · N:1'],[1,3,'包含 · N:M'],[0,4,'持有 · 1:N'],[4,5,'隶属 · N:1']]:[[0,1,'下单 · 1:N'],[1,2,'生成 · 1:N'],[1,3,'包含 · N:M'],[2,4,'关联 · N:1'],[5,3,'供应 · N:M']];}
function graph(){const c=configs[scope],pos=[[25,50],[260,50],[495,50],[260,230],[495,230],[25,230]],visible=c.names.map(n=>n.includes(filter));let svg='<svg viewBox="0 0 700 340" role="group" aria-label="业务对象类型关系图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a4bdb9"/></marker></defs>';
for(const[a,b,label]of relations()){if(!visible[a]||!visible[b])continue;const[x,y]=pos[a],[u,v]=pos[b];const dx=u-x,dy=v-y,len=Math.hypot(dx,dy),r= Math.abs(dx)>Math.abs(dy)?85:48;svg+=`<line x1="${x+85+dx/len*r}" y1="${y+38+dy/len*r}" x2="${u+85-dx/len*r}" y2="${v+38-dy/len*r}" marker-end="url(#arrow)"/><text x="${(x+u)/2+85}" y="${(y+v)/2+29}" text-anchor="middle">${label}</text>`;}
c.names.forEach((n,i)=>{if(!visible[i])return;const[x,y]=pos[i];svg+=`<g role="button" tabindex="0" aria-label="查看${n}" class="node ${selected===i?'selected':''}" data-node="${i}" transform="translate(${x} ${y})"><rect width="170" height="76"/><text x="16" y="29" class="title">${n}</text><text x="16" y="53" class="sub">${c.ids[i]} · ${fields(i).length} 个属性</text></g>`;});return svg+'</svg>';}
function render(){const c=configs[scope],s=state(),p=s.proposal;document.querySelectorAll('.sidebar button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('title').textContent=c.company+' · '+({model:'业务模型',sources:'数据与映射',chat:'聊天与 Agent',review:'变更与发布',versions:'版本记录'}[page]);document.getElementById('subtitle').textContent=`${c.project} / 公司基线 v${c.baseline} / 项目模型 v${s.version} · 客户空间独立授权`;
if(page==='model'){app.innerHTML=`<div class="stats"><div class="stat"><span class="muted">业务对象类型</span><b>6</b><span class="muted">稳定 ID · 项目命名空间</span></div><div class="stat"><span class="muted">业务关系</span><b>5</b><span class="muted">方向与基数已标注</span></div><div class="stat"><span class="muted">候选来源</span><b>3</b><span class="muted">DDL / ERP / 知识文档</span></div><div class="stat"><span class="muted">当前项目版本</span><b>v${s.version}</b><span class="muted">固定引用 · 按需升级</span></div></div><div class="workspace"><section class="card"><div class="cardhead"><h2>业务对象关系图 <span class="badge">类型图</span></h2><input id="search" aria-label="搜索对象" placeholder="搜索业务对象…" value="${esc(filter)}"></div><div class="graph" id="graph">${graph()}</div><div class="legend">○ 业务对象类型　→ 业务关系与基数　· 点击对象查看定义；不是客户实例数据</div></section><aside class="card"><div class="detail-head"><div class="eyebrow">Object definition</div><h2>${c.names[selected]}</h2><code>${c.ids[selected]}</code></div><div class="cardbody"><span class="badge">人工确认 · 演示</span><p class="muted">业务字段与系统字段分别维护，重命名保持对象 ID。</p>${fields(selected).map(f=>`<div class="field"><b>${f[0]}</b><br><code>${f[1]}</code><div class="muted">${f[2]}</div></div>`).join('')}<p class="muted">证据：业务字典 v3 / §2<br>确认：示例业务负责人</p><button class="wide" data-page="sources">查看来源与映射 →</button></div></aside></div>`;}
if(page==='sources'){app.innerHTML=`<div class="steps"><span class="step on">01 上传契约</span><span class="step on">02 候选发现</span><span class="step on">03 业务确认</span><span class="step">04 映射校验</span><span class="step">05 版本发布</span></div><div class="grid2"><section class="card"><div class="cardhead"><h2>来源目录</h2><button id="import">＋ 导入资料</button></div><div class="cardbody">${[['数据库结构','DDL · 12 张表 · 合成契约','只读元数据'],['ERP 接口定义','OpenAPI · 8 个 operation','未建立连接'],['业务知识文档','交付管理规范 v3 · §2–4','证据已关联']].map(x=>`<div class="field"><b>${x[0]}</b><span class="badge" style="float:right">${x[2]}</span><p class="muted">${x[1]}</p></div>`).join('')}<p class="note">这里展示契约和映射。正式连接由来源管理员配置，凭据不进入模型上下文。</p></div></section><section class="card"><div class="cardhead"><h2>${c.names[1]} · 字段映射</h2><span class="badge amber">结构示例</span></div><div class="cardbody tablewrap"><table><thead><tr><th>业务属性</th><th>来源字段</th><th>状态</th></tr></thead><tbody><tr><td>订单号</td><td>order_no</td><td>已确认</td></tr><tr><td>客户编码</td><td>customer_code</td><td>需主数据对齐</td></tr><tr><td>订单状态</td><td>order_status</td><td>枚举待确认</td></tr><tr><td>承诺交期</td><td>delivery_date</td><td>${s.history.length?'已发布（演示）':'待提案'}</td></tr></tbody></table><p class="muted">源契约：demo-3 · 转换：ISO 日期<br>空值：未知交期，不计入已逾期<br>尚未验证真实行数据质量。</p><button class="primary" data-page="chat">让 Agent 补充模型 →</button></div></section></div>`;}
if(page==='chat'){app.innerHTML=`<div class="grid2"><section class="card"><div class="cardhead"><h2>带着客户模型聊天</h2><span class="badge">${c.project} / v${s.version}</span></div><div class="cardbody"><div class="message">这个客户有哪些业务对象？</div><div class="message agent">当前模型定义了${c.names.join('、')}。<p class="muted">依据：本体模型 v${s.version} · 合成定义<br>这不是实时业务数据查询。</p></div><label for="question"><b>描述你想固化的业务规则</b></label><textarea id="question">${esc(s.question)}</textarea><p class="muted">示例提案只演示「承诺交期」；输入的其他诉求会保留为需求，不执行自由文本指令。</p><button class="primary" id="propose" ${s.history.length?'disabled':''}>生成模型变更提案</button>${s.history.length?'<p class="muted">本项目已完成示例发布，可切换项目体验另一轮。</p>':''}</div></section><section class="card"><div class="cardhead"><h2>网页、CLI 与 Agent 共用契约</h2></div><div class="cardbody"><div class="diff">ontology.describe → 固定版本定义<br>ontology.query → 受限实例查询<br>ontology.propose → 结构化草稿<br>ontology.validate → 校验与影响</div><h3 style="margin-top:24px">本次上下文</h3><div class="field">客户空间：${c.company}</div><div class="field">项目：${c.project}</div><div class="field">基线：v${s.version} · 版本固定</div><div class="field">Agent 权限：读取定义 / 提交提案</div><p class="note">模型变更不改变数据库表，也不调用 ERP 写接口。发布由具备权限的人员完成。</p><p class="muted">CLI / MCP / 插件接入均为拟议能力，原型没有运行这些工具。</p></div></section></div>`;}
if(page==='review'){if(!p){app.innerHTML='<section class="card empty"><h2>暂无模型变更</h2><p>从业务需求生成提案，再查看差异、影响与校验结果。</p><button class="primary" data-page="chat">创建示例提案</button></section>';return;}app.innerHTML=`<div class="steps"><span class="step on">01 草稿</span><span class="step ${p.status!=='draft'?'on':''}">02 结构校验</span><span class="step ${p.status==='published'?'on':''}">03 人员审批与发布</span></div><div class="grid2"><section class="card"><div class="cardhead"><h2>为${c.names[1]}补充承诺交期</h2><span class="badge">${p.status==='draft'?'待校验':p.status==='validated'?'模拟校验通过':'已模拟发布'}</span></div><div class="cardbody"><p class="muted">提案基线 v${p.base} → v${p.base+1} · 来源：聊天 / 演示 Agent</p><div class="diff">+ ${c.ids[1]}.promised_date: date | null<br>+ 映射 ERP.listOrders.delivery_date<br>+ 指标：已逾期订单数<br>+ 规则：未关闭 &amp; promised_date &lt; business_date<br>+ 空交期：未知，不计入已逾期</div><h3 style="margin-top:20px">原始需求</h3><p>${esc(p.request)}</p><p class="muted">演示前提：业务日期按客户业务时区计算；关闭状态枚举已在示例契约确认。</p></div></section><section class="card"><div class="cardhead"><h2>影响与发布检查</h2></div><div class="cardbody"><div class="field">影响：1 个对象 / 1 个映射 / 1 个指标</div><div class="field">项目：只修改当前项目覆盖</div><div class="field">其他客户：不受影响</div><div class="field">数据库及 ERP 写入：无</div><p class="note">${p.status==='draft'?'等待运行模拟结构校验。':p.status==='validated'?'演示：类型、来源引用、基线和权限检查通过。未连接真实数据；生产环境还需校验来源与业务口径。':'已发布到当前页面内存；不代表服务端持久化或真实人员授权。'}</p><div class="row"><button id="validate" ${p.status!=='draft'?'disabled':''}>模拟校验</button><button class="primary" id="publish" ${p.status!=='validated'?'disabled':''}>模拟审批并发布</button></div><p class="muted">正式发布将复核提案哈希、权限和最新基线。Agent 不能自行批准。</p>${p.status==='published'?'<button data-page="versions">查看版本记录 →</button>':''}</div></section></div>`;}
if(page==='versions'){app.innerHTML=`<section class="card"><div class="cardhead"><h2>模型版本 · ${c.project}</h2><span class="badge">历史版本不可变</span></div><div class="cardbody">${s.history.map(v=>`<div class="version"><b>v${v}　新增承诺交期与已逾期口径</b><p class="muted">演示发布人：本体管理员 · 页面内存记录</p><p>当前项目引用已更新，其他项目保持原版本。</p></div>`).join('')}<div class="version"><b>v${c.baseline}　项目基线</b><p class="muted">6 个业务对象 / 5 个关系 · 合成模型</p><p>公司业务定义固定引用，项目升级需要显式提案。</p></div><p class="note">正式版回滚会发布一个恢复旧内容的新版本；不删除历史。原型刷新后恢复初始状态。</p></div></section>`;}}
document.getElementById('scope').addEventListener('change',e=>{scope=e.target.value;selected=1;filter='';render();toast('已切换客户 / 项目，模型与提案按项目隔离');});
document.addEventListener('click',e=>{const node=e.target.closest('[data-node]');if(node){selected=Number(node.dataset.node);render();return;}const b=e.target.closest('button');if(!b||b.disabled)return;const s=state();if(b.dataset.page){page=b.dataset.page;filter='';render();}else if(b.id==='propose'){s.question=document.getElementById('question').value.trim();if(!s.question){toast('请先填写业务需求');return;}s.proposal={base:s.version,status:'draft',request:s.question};page='review';render();toast('已生成固定示例提案，尚未发布');}else if(b.id==='validate'){s.proposal.status='validated';render();toast('模拟结构校验通过');}else if(b.id==='publish'){if(s.proposal.base!==s.version){toast('基线冲突，请重新生成提案');return;}s.version++;s.history.unshift(s.version);s.proposal.status='published';render();toast('已模拟发布 v'+s.version+'，未写入真实系统');}else if(b.id==='import'){toast('设计说明：正式版支持 DDL、OpenAPI 与业务文档；本原型不上传文件');}else if(b.id==='export'){const blob=new Blob([JSON.stringify(modelExport(),null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ontology-demo-'+scope+'-v'+s.version+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
document.addEventListener('keydown',e=>{const n=e.target.closest('[data-node]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();n.dispatchEvent(new MouseEvent('click',{bubbles:true}));const current=app.querySelector(`[data-node="${selected}"]`);current?.focus();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;document.getElementById('graph').innerHTML=graph();}if(e.target.id==='question')state().question=e.target.value;});render();
</script></body></html>
