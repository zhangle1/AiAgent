- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: AIAGENT_ACCESS_TOKEN
    baseURL: !!js process.env.AIAGENT_LLM_BASE_URL ?? 'http://127.0.0.1:5000/api/v1/deepseek-plugin'
    models:
      - id: !!js process.env.AIAGENT_MODEL_ID ?? 'deepseek-flash'
        name: AiAgent Remote Model
        contextWindow: 128000
        maxTokens: 8192

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: !!js process.env.AIAGENT_MODEL_ID ?? 'deepseek-flash'

- insert:
    - id: aiagent-remote-tools
      name: '@aiagent/deepseek-plugin-remote'
      config:
        baseUrl: !!js process.env.AIAGENT_BASE_URL ?? 'http://127.0.0.1:5000'
        baseUrlEnv: AIAGENT_BASE_URL
        accessTokenEnv: AIAGENT_ACCESS_TOKEN
        enableCodex: true
        codexModelEnv: AIAGENT_CODEX_MODEL_ID
        maxContextChars: 120000
