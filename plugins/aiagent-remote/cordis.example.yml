- id: aiagent-llm
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: AIAGENT_ACCESS_TOKEN
    baseURL: !!js process.env.AIAGENT_LLM_BASE_URL
    models:
      - id: !!js process.env.AIAGENT_MODEL_ID
        name: AiAgent Remote Model
        contextWindow: 128000
        maxTokens: 8192

- id: aiagent-remote-tools
  name: './src/index.ts'
  config:
    baseUrl: !!js process.env.AIAGENT_BASE_URL
    accessTokenEnv: AIAGENT_ACCESS_TOKEN
    enableCodex: true
    codexModelEnv: AIAGENT_CODEX_MODEL_ID
    maxContextChars: 120000
